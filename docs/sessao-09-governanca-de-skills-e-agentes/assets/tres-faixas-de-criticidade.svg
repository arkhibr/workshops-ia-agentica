<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 570" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="570" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">As três faixas de criticidade, com características típicas e tratamento mínimo</text>
<rect x="60" y="120" width="470" height="340" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="60" y="120" width="470" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="160" font-size="26" font-weight="bold" fill="#12302b">Baixa</text>
<text x="82" y="228" font-size="18" font-weight="bold" fill="#00695c">Características típicas</text>
<text x="82" y="258" font-size="19" fill="#37474f">Conteúdo público, sem dado pessoal, somente</text>
<text x="82" y="283" font-size="19" fill="#37474f">leitura e revisão humana de toda saída</text>
<line x1="82" y1="313" x2="508" y2="313" stroke="#cfd8dc" stroke-width="2"/>
<text x="82" y="351" font-size="18" font-weight="bold" fill="#00695c">Tratamento mínimo</text>
<text x="82" y="381" font-size="19" font-weight="bold" fill="#12302b">Registro na ficha, testes básicos e</text>
<text x="82" y="406" font-size="19" font-weight="bold" fill="#12302b">aprovação do PO e do líder técnico</text>
<rect x="565" y="120" width="470" height="340" rx="14" fill="#ffffff" stroke="#78909c" stroke-width="3"/>
<rect x="565" y="120" width="470" height="62" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/>
<text x="583" y="160" font-size="26" font-weight="bold" fill="#12302b">Moderada</text>
<text x="587" y="228" font-size="18" font-weight="bold" fill="#455a64">Características típicas</text>
<text x="587" y="258" font-size="19" fill="#37474f">Conteúdo interno, recuperação de documentos</text>
<text x="587" y="283" font-size="19" fill="#37474f">(RAG), integração limitada ou decisão assistida</text>
<line x1="587" y1="313" x2="1013" y2="313" stroke="#cfd8dc" stroke-width="2"/>
<text x="587" y="351" font-size="18" font-weight="bold" fill="#455a64">Tratamento mínimo</text>
<text x="587" y="381" font-size="19" font-weight="bold" fill="#12302b">Avaliação de riscos, revisão de segurança e</text>
<text x="587" y="406" font-size="19" font-weight="bold" fill="#12302b">privacidade conforme os dados e testes</text>
<text x="587" y="431" font-size="19" font-weight="bold" fill="#12302b">adversariais</text>
<rect x="1070" y="120" width="470" height="340" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="1070" y="120" width="470" height="62" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1088" y="160" font-size="26" font-weight="bold" fill="#12302b">Alta</text>
<text x="1092" y="228" font-size="18" font-weight="bold" fill="#e65100">Características típicas</text>
<text x="1092" y="258" font-size="19" fill="#37474f">Dado sensível, efeito relevante sobre pessoas,</text>
<text x="1092" y="283" font-size="19" fill="#37474f">escrita em sistemas ou execução financeira</text>
<line x1="1092" y1="313" x2="1518" y2="313" stroke="#cfd8dc" stroke-width="2"/>
<text x="1092" y="351" font-size="18" font-weight="bold" fill="#e65100">Tratamento mínimo</text>
<text x="1092" y="381" font-size="19" font-weight="bold" fill="#12302b">Avaliação aprofundada, aprovações formais,</text>
<text x="1092" y="406" font-size="19" font-weight="bold" fill="#12302b">restrições fortes e a possibilidade de não</text>
<text x="1092" y="431" font-size="19" font-weight="bold" fill="#12302b">implementar</text>
<line x1="60" y1="490" x2="1540" y2="490" stroke="#78909c" stroke-width="3" marker-end="url(#sn)"/>
<text x="60" y="520" font-size="17" fill="#78909c">tratamento mais exigente</text>
<text x="1540" y="545" font-size="17" text-anchor="end" fill="#78909c">Ferramenta pedagógica, sem valor normativo. Com dado pessoal, a faixa fica preliminar até a avaliação jurídica e de privacidade.</text>
</svg>

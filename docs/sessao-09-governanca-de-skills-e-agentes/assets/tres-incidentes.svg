<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="760" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Três incidentes típicos de agentes, com o controle fora do modelo que previne cada um</text>
<rect x="60" y="110" width="470" height="580" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="60" y="110" width="470" height="66" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="78" y="151" font-size="22" font-weight="bold" fill="#12302b">A. Instrução escondida no documento</text>
<text x="82" y="208" font-size="18" font-weight="bold" fill="#e65100">LLM01 (2026), injeção de prompt</text>
<text x="82" y="240" font-size="18" fill="#37474f">Um documento recuperado manda ignorar o</text>
<text x="82" y="264" font-size="18" fill="#37474f">solicitante e enviar o conteúdo a uma URL externa.</text>
<text x="82" y="346" font-size="18" font-weight="bold" fill="#00695c">Prevenir</text>
<rect x="82" y="360" width="426" height="54" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="98" y="382" font-size="14" font-weight="bold" fill="#00695c">fora do modelo</text>
<text x="98" y="404" font-size="17" font-weight="bold" fill="#12302b">Bloqueio de saída de rede não autorizada</text>
<text x="82" y="446" font-size="17" fill="#37474f">Conteúdo recuperado tratado como dado, instruções</text>
<text x="82" y="468" font-size="17" fill="#37474f">do sistema isoladas e ferramentas permitidas por</text>
<text x="82" y="490" font-size="17" fill="#37474f">política</text>
<line x1="82" y1="550" x2="508" y2="550" stroke="#cfd8dc" stroke-width="2"/>
<text x="82" y="580" font-size="18" font-weight="bold" fill="#00695c">Detectar e responder</text>
<text x="82" y="610" font-size="17" fill="#37474f">Teste adversarial, log das chamadas, negação,</text>
<text x="82" y="632" font-size="17" fill="#37474f">suspensão e análise</text>
<rect x="565" y="110" width="470" height="580" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="565" y="110" width="470" height="66" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="583" y="151" font-size="22" font-weight="bold" fill="#12302b">B. Permissão maior que a finalidade</text>
<text x="587" y="208" font-size="18" font-weight="bold" fill="#e65100">LLM03 (2026), agência excessiva</text>
<text x="587" y="240" font-size="18" fill="#37474f">Uma skill de consulta recebe token que também</text>
<text x="587" y="264" font-size="18" fill="#37474f">altera cadastro e aprova pagamento, e o modelo</text>
<text x="587" y="288" font-size="18" fill="#37474f">chama a função errada.</text>
<text x="587" y="346" font-size="18" font-weight="bold" fill="#00695c">Prevenir</text>
<rect x="587" y="360" width="426" height="54" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="603" y="382" font-size="14" font-weight="bold" fill="#00695c">fora do modelo</text>
<text x="603" y="404" font-size="17" font-weight="bold" fill="#12302b">Credencial por serviço com menor privilégio</text>
<text x="587" y="446" font-size="17" fill="#37474f">Lista explícita de operações e confirmação humana</text>
<text x="587" y="468" font-size="17" fill="#37474f">para escrita</text>
<line x1="587" y1="550" x2="1013" y2="550" stroke="#cfd8dc" stroke-width="2"/>
<text x="587" y="580" font-size="18" font-weight="bold" fill="#00695c">Detectar e responder</text>
<text x="587" y="610" font-size="17" fill="#37474f">Auditoria das ações, alerta para chamada fora do</text>
<text x="587" y="632" font-size="17" fill="#37474f">escopo e revogação do token</text>
<rect x="1070" y="110" width="470" height="580" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="1070" y="110" width="470" height="66" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1088" y="151" font-size="22" font-weight="bold" fill="#12302b">C. Resposta plausível e incorreta</text>
<text x="1092" y="208" font-size="18" font-weight="bold" fill="#e65100">LLM07 (2026), desinformação</text>
<text x="1092" y="240" font-size="18" fill="#37474f">O agente cita uma norma interna revogada e</text>
<text x="1092" y="264" font-size="18" fill="#37474f">informa um prazo errado, e um analista poderia</text>
<text x="1092" y="288" font-size="18" fill="#37474f">encaminhar a resposta sem conferir.</text>
<text x="1092" y="346" font-size="18" font-weight="bold" fill="#00695c">Prevenir</text>
<rect x="1092" y="360" width="426" height="54" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="1108" y="382" font-size="14" font-weight="bold" fill="#00695c">fora do modelo</text>
<text x="1108" y="404" font-size="17" font-weight="bold" fill="#12302b">Recuperação restrita à versão vigente</text>
<text x="1092" y="446" font-size="17" fill="#37474f">Fonte e data na resposta e proibição de resposta</text>
<text x="1092" y="468" font-size="17" fill="#37474f">categórica sem evidência</text>
<line x1="1092" y1="550" x2="1518" y2="550" stroke="#cfd8dc" stroke-width="2"/>
<text x="1092" y="580" font-size="18" font-weight="bold" fill="#00695c">Detectar e responder</text>
<text x="1092" y="610" font-size="17" fill="#37474f">Avaliação com gabarito, revisão humana, sinalização</text>
<text x="1092" y="632" font-size="17" fill="#37474f">de incerteza e canal de correção</text>
<text x="60" y="730" font-size="19" fill="#37474f">Os testes T01 a T07 da página Controles e evidências verificam esses controles.</text>
</svg>

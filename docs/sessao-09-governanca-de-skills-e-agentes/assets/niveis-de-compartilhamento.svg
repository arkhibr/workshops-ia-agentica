<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="750" fill="#ffffff"/>
<text x="60" y="60" font-size="30" font-weight="bold" fill="#12302b">Quatro níveis de compartilhamento de uma skill no Claude Code</text>
<line x1="60" y1="100" x2="1510" y2="100" stroke="#78909c" stroke-width="3" marker-end="url(#seta)"/>
<text x="60" y="128" font-size="17" fill="#546e7a">alcance crescente</text>
<rect x="60" y="150" width="345" height="470" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="60" y="150" width="345" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="191" font-size="26" font-weight="bold" fill="#12302b">Pessoal</text>
<text x="78" y="246" font-size="18" font-weight="bold" fill="#00695c">Onde fica</text>
<text x="78" y="274" font-size="17" fill="#37474f">~/.claude/skills/ na</text>
<text x="78" y="299" font-size="17" fill="#37474f">máquina da pessoa</text>
<text x="78" y="344" font-size="18" font-weight="bold" fill="#00695c">Quem configura</text>
<text x="78" y="372" font-size="17" fill="#37474f">O próprio usuário</text>
<text x="78" y="417" font-size="18" font-weight="bold" fill="#00695c">Como a atualização chega</text>
<text x="78" y="445" font-size="17" fill="#37474f">Cópia manual para</text>
<text x="78" y="470" font-size="17" fill="#37474f">outra máquina</text>
<rect x="430" y="150" width="345" height="470" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="430" y="150" width="345" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="448" y="191" font-size="26" font-weight="bold" fill="#12302b">Repositório</text>
<text x="448" y="246" font-size="18" font-weight="bold" fill="#00695c">Onde fica</text>
<text x="448" y="274" font-size="17" fill="#37474f">.claude/skills/ versionado ou</text>
<text x="448" y="299" font-size="17" fill="#37474f">registro em .claude/settings.json</text>
<text x="448" y="344" font-size="18" font-weight="bold" fill="#00695c">Quem configura</text>
<text x="448" y="372" font-size="17" fill="#37474f">Quem faz commit no repositório,</text>
<text x="448" y="397" font-size="17" fill="#37474f">aplicado após a confiança na pasta</text>
<text x="448" y="442" font-size="18" font-weight="bold" fill="#00695c">Como a atualização chega</text>
<text x="448" y="470" font-size="17" fill="#37474f">Pelo commit, a cada git pull</text>
<rect x="800" y="150" width="345" height="470" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="800" y="150" width="345" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="818" y="191" font-size="26" font-weight="bold" fill="#12302b">Marketplace</text>
<text x="818" y="246" font-size="18" font-weight="bold" fill="#00695c">Onde fica</text>
<text x="818" y="274" font-size="17" fill="#37474f">Pasta ou repositório com</text>
<text x="818" y="299" font-size="17" fill="#37474f">.claude-plugin/marketplace.json</text>
<text x="818" y="344" font-size="18" font-weight="bold" fill="#00695c">Quem configura</text>
<text x="818" y="372" font-size="17" fill="#37474f">Mantenedor publica, cada</text>
<text x="818" y="397" font-size="17" fill="#37474f">usuário registra e instala</text>
<text x="818" y="442" font-size="18" font-weight="bold" fill="#00695c">Como a atualização chega</text>
<text x="818" y="470" font-size="17" fill="#37474f">Fonte git ou remota: pela</text>
<text x="818" y="495" font-size="17" fill="#37474f">version (documentado)</text>
<text x="818" y="520" font-size="17" fill="#37474f">Pasta local: version governa</text>
<text x="818" y="545" font-size="17" fill="#37474f">aviso, número e cache, e o</text>
<text x="818" y="570" font-size="17" fill="#37474f">conteúdo vem da pasta (observado)</text>
<rect x="1170" y="150" width="345" height="470" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="1170" y="150" width="345" height="62" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1188" y="191" font-size="26" font-weight="bold" fill="#12302b">Organização</text>
<text x="1188" y="246" font-size="18" font-weight="bold" fill="#e65100">Onde fica</text>
<text x="1188" y="274" font-size="17" fill="#37474f">Configurações gerenciadas e</text>
<text x="1188" y="299" font-size="17" fill="#37474f">Organization settings &gt;</text>
<text x="1188" y="324" font-size="17" fill="#37474f">Plugins &amp; skills do claude.ai</text>
<text x="1188" y="369" font-size="18" font-weight="bold" fill="#e65100">Quem configura</text>
<text x="1188" y="397" font-size="17" fill="#37474f">Administrador da organização</text>
<text x="1188" y="422" font-size="17" fill="#37474f">(Owner para as configurações</text>
<text x="1188" y="447" font-size="17" fill="#37474f">gerenciadas pelo servidor)</text>
<text x="1188" y="492" font-size="18" font-weight="bold" fill="#e65100">Como a atualização chega</text>
<text x="1188" y="520" font-size="17" fill="#37474f">Pela política, no início</text>
<text x="1188" y="545" font-size="17" fill="#37474f">da sessão, sem ação do usuário</text>
<path d="M60,642 L60,660 L1145,660 L1145,642" fill="none" stroke="#00695c" stroke-width="3"/>
<text x="60" y="694" font-size="20" font-weight="bold" fill="#00695c">Sem privilégio de administrador: configurados pela própria equipe</text>
<path d="M1170,642 L1170,660 L1515,660 L1515,642" fill="none" stroke="#e65100" stroke-width="3"/>
<text x="1170" y="694" font-size="20" font-weight="bold" fill="#e65100">Exige administrador</text>
</svg>

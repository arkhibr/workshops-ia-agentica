<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 730" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="s00695c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="se65100" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="s78909c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="730" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Autonomia e supervisão: até quando a pessoa ainda pode rejeitar a ação</text>
<line x1="370" y1="140" x2="1180" y2="140" stroke="#78909c" stroke-width="3" marker-end="url(#s78909c)"/>
<text x="370" y="124" font-size="16" fill="#78909c">proposta do agente</text>
<text x="1180" y="124" font-size="16" text-anchor="end" fill="#78909c">depois do fato</text>
<line x1="800" y1="150" x2="800" y2="590" stroke="#e65100" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="700" y="104" width="200" height="36" rx="18" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="800" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#12302b">Efeito no sistema</text>
<text x="1220" y="124" font-size="17" font-weight="bold" fill="#00695c">Rejeitar antes do efeito</text>
<text x="1220" y="146" font-size="17" font-weight="bold" fill="#00695c">irreversível?</text>
<rect x="60" y="180" width="280" height="120" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5"/>
<text x="80" y="248" font-size="22" font-weight="bold" fill="#12302b">Sugere</text>
<rect x="380" y="190" width="380" height="100" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="2.5"/>
<text x="400" y="228" font-size="19" font-weight="bold" fill="#12302b">A pessoa decide e executa</text>
<text x="400" y="258" font-size="16" fill="#37474f">Rejeitar é não executar a sugestão</text>
<rect x="1210" y="190" width="330" height="100" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5"/>
<text x="1230" y="230" font-size="17" font-weight="bold" fill="#12302b">Sim, porque a decisão</text>
<text x="1230" y="256" font-size="17" font-weight="bold" fill="#12302b">e a execução são da pessoa</text>
<rect x="60" y="320" width="280" height="120" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5"/>
<text x="80" y="374" font-size="22" font-weight="bold" fill="#12302b">Prepara para</text>
<text x="80" y="402" font-size="22" font-weight="bold" fill="#12302b">aprovação</text>
<rect x="380" y="330" width="380" height="100" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="2.5"/>
<text x="400" y="368" font-size="19" font-weight="bold" fill="#12302b">O agente prepara a ação</text>
<text x="400" y="398" font-size="16" fill="#37474f">A execução depende de aprovação</text>
<text x="400" y="419" font-size="16" fill="#37474f">explícita</text>
<rect x="1210" y="330" width="330" height="100" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5"/>
<text x="1230" y="370" font-size="17" font-weight="bold" fill="#12302b">Sim, desde que a aprovação</text>
<text x="1230" y="396" font-size="17" font-weight="bold" fill="#12302b">não se torne automática</text>
<rect x="60" y="460" width="280" height="120" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
<text x="80" y="528" font-size="22" font-weight="bold" fill="#12302b">Executa</text>
<rect x="380" y="470" width="380" height="100" rx="14" fill="#ffffff" stroke="#78909c" stroke-width="2.5"/>
<text x="400" y="508" font-size="19" font-weight="bold" fill="#12302b">O agente executa sem aprovação</text>
<text x="400" y="538" font-size="16" fill="#37474f">Nenhum ponto de rejeição antes do efeito</text>
<line x1="760" y1="520" x2="836" y2="520" stroke="#e65100" stroke-width="3" marker-end="url(#se65100)"/>
<rect x="840" y="470" width="340" height="100" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
<text x="860" y="508" font-size="19" font-weight="bold" fill="#12302b">Log e alerta</text>
<text x="860" y="538" font-size="16" fill="#37474f">A supervisão ocorre depois do efeito</text>
<rect x="1210" y="470" width="330" height="100" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
<text x="1230" y="510" font-size="17" font-weight="bold" fill="#12302b">Não: a revisão depois do fato</text>
<text x="1230" y="536" font-size="17" font-weight="bold" fill="#12302b">funciona como controle detectivo</text>
<rect x="60" y="610" width="1480" height="96" rx="14" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="2"/>
<text x="84" y="640" font-size="17" fill="#37474f">As quatro condições da supervisão humana efetiva valem ao mesmo tempo: informação, tempo, autoridade</text>
<text x="84" y="662" font-size="17" fill="#37474f">e possibilidade real de rejeitar antes que o efeito se torne irreversível. Na aprovação repetitiva, a complacência</text>
<text x="84" y="684" font-size="17" fill="#37474f">e o viés de automação comprometem a informação e o exame atento (Parasuraman e Manzey, 2010).</text>
</svg>

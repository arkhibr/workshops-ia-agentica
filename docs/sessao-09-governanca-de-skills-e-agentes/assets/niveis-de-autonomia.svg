<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="600" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Três níveis de autonomia: quem executa a ação e quando a pessoa supervisiona</text>
<line x1="60" y1="110" x2="1530" y2="110" stroke="#78909c" stroke-width="3" marker-end="url(#sn)"/>
<text x="60" y="136" font-size="18" fill="#78909c">autonomia crescente</text>
<rect x="60" y="250" width="470" height="250" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="60" y="250" width="470" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="290" font-size="25" font-weight="bold" fill="#12302b">Sugere</text>
<text x="80" y="354" font-size="18" font-weight="bold" fill="#00695c">Quem executa</text>
<text x="80" y="382" font-size="19" fill="#37474f">O agente sugere, e a pessoa decide e executa.</text>
<text x="80" y="432" font-size="18" font-weight="bold" fill="#00695c">Quando a pessoa supervisiona</text>
<text x="80" y="460" font-size="19" font-weight="bold" fill="#12302b">Antes da ação, porque a decisão é da pessoa.</text>
<rect x="565" y="210" width="470" height="290" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="565" y="210" width="470" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="583" y="250" font-size="25" font-weight="bold" fill="#12302b">Prepara para aprovação</text>
<text x="585" y="314" font-size="18" font-weight="bold" fill="#00695c">Quem executa</text>
<text x="585" y="342" font-size="19" fill="#37474f">O agente prepara a ação, como um rascunho de</text>
<text x="585" y="367" font-size="19" fill="#37474f">pull request ou uma mudança de cadastro.</text>
<text x="585" y="417" font-size="18" font-weight="bold" fill="#00695c">Quando a pessoa supervisiona</text>
<text x="585" y="445" font-size="19" font-weight="bold" fill="#12302b">Antes da execução, que depende de aprovação</text>
<text x="585" y="470" font-size="19" font-weight="bold" fill="#12302b">explícita.</text>
<rect x="1070" y="170" width="470" height="330" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="1070" y="170" width="470" height="62" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1088" y="210" font-size="25" font-weight="bold" fill="#12302b">Executa</text>
<text x="1090" y="274" font-size="18" font-weight="bold" fill="#e65100">Quem executa</text>
<text x="1090" y="302" font-size="19" fill="#37474f">O agente executa a ação sem aprovação prévia.</text>
<text x="1090" y="352" font-size="18" font-weight="bold" fill="#e65100">Quando a pessoa supervisiona</text>
<text x="1090" y="380" font-size="19" font-weight="bold" fill="#12302b">Depois do fato, por log e alerta.</text>
<text x="60" y="560" font-size="19" fill="#37474f">A linha “Autonomia” da ficha registra o nível, a resposta a “quem escolhe a próxima transição” e quem pode interromper a execução.</text>
</svg>

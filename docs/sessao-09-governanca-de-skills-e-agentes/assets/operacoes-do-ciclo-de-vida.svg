<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="420" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Cinco operações do ciclo de vida de um plugin e o mecanismo de cada uma</text>
<rect x="60" y="170" width="272" height="200" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="60" y="170" width="272" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="209" font-size="24" font-weight="bold" fill="#12302b">Publicar</text>
<text x="78" y="270" font-size="17" fill="#37474f">Entrada nova em plugins no</text>
<text x="78" y="292" font-size="17" fill="#37474f">marketplace.json, conferida</text>
<text x="78" y="314" font-size="17" fill="#37474f">por claude plugin validate</text>
<rect x="362" y="170" width="272" height="200" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="362" y="170" width="272" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="380" y="209" font-size="24" font-weight="bold" fill="#12302b">Versionar</text>
<text x="380" y="270" font-size="17" fill="#37474f">Campo version no plugin.json,</text>
<text x="380" y="292" font-size="17" fill="#37474f">com precedência sobre a</text>
<text x="380" y="314" font-size="17" fill="#37474f">version do marketplace</text>
<rect x="664" y="170" width="272" height="200" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="664" y="170" width="272" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="682" y="209" font-size="24" font-weight="bold" fill="#12302b">Fixar</text>
<text x="682" y="270" font-size="17" fill="#37474f">Campos ref e sha na fonte</text>
<text x="682" y="292" font-size="17" fill="#37474f">git: ramo, etiqueta ou commit</text>
<rect x="966" y="170" width="272" height="200" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="966" y="170" width="272" height="62" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="984" y="209" font-size="24" font-weight="bold" fill="#12302b">Renomear</text>
<text x="984" y="270" font-size="17" fill="#37474f">Mapa renames no</text>
<text x="984" y="292" font-size="17" fill="#37474f">marketplace.json, do nome</text>
<text x="984" y="314" font-size="17" fill="#37474f">antigo para o novo</text>
<rect x="1268" y="170" width="272" height="200" rx="14" fill="#ffffff" stroke="#e65100" stroke-width="3"/>
<rect x="1268" y="170" width="272" height="62" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1286" y="209" font-size="24" font-weight="bold" fill="#12302b">Retirar</text>
<text x="1286" y="270" font-size="17" fill="#37474f">renames com null e a opção</text>
<text x="1286" y="292" font-size="17" fill="#37474f">forceRemoveDeletedPlugins</text>
<path d="M60,150 L60,136 L936,136 L936,150" fill="none" stroke="#00695c" stroke-width="3"/>
<text x="60" y="124" font-size="19" font-weight="bold" fill="#00695c">Linha “Canal e versão”</text>
<path d="M966,150 L966,136 L1540,136 L1540,150" fill="none" stroke="#e65100" stroke-width="3"/>
<text x="966" y="124" font-size="19" font-weight="bold" fill="#e65100">Linha “Revisão e retirada”</text>
</svg>

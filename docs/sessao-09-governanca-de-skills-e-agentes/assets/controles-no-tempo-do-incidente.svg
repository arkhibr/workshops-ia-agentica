<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="590" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Preventivo, detectivo e de resposta: o momento em que cada controle age</text>
<line x1="60" y1="150" x2="1530" y2="150" stroke="#78909c" stroke-width="3" marker-end="url(#sn)"/>
<text x="60" y="136" font-size="17" fill="#78909c">tempo</text>
<line x1="560" y1="120" x2="560" y2="470" stroke="#e65100" stroke-width="2.5" stroke-dasharray="9 7"/>
<rect x="460" y="104" width="200" height="36" rx="18" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="560" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#12302b">Evento de risco</text>
<line x1="1060" y1="120" x2="1060" y2="470" stroke="#e65100" stroke-width="2.5" stroke-dasharray="9 7"/>
<rect x="960" y="104" width="200" height="36" rx="18" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="1060" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#12302b">Detecção</text>
<rect x="60" y="190" width="480" height="280" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="60" y="190" width="480" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="229" font-size="24" font-weight="bold" fill="#12302b">Preventivo</text>
<text x="80" y="290" font-size="19" font-weight="bold" fill="#12302b">Antes do evento, reduz a chance de ele</text>
<text x="80" y="315" font-size="19" font-weight="bold" fill="#12302b">ocorrer</text>
<text x="80" y="359" font-size="17" font-weight="bold" fill="#00695c">Exemplo num agente</text>
<text x="80" y="387" font-size="18" fill="#37474f">Token somente de leitura, lista explícita de</text>
<text x="80" y="411" font-size="18" fill="#37474f">ferramentas, bloqueio de saída de rede</text>
<rect x="580" y="190" width="460" height="280" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="580" y="190" width="460" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="598" y="229" font-size="24" font-weight="bold" fill="#12302b">Detectivo</text>
<text x="600" y="290" font-size="19" font-weight="bold" fill="#12302b">Durante ou depois do evento, mostra que ele</text>
<text x="600" y="315" font-size="19" font-weight="bold" fill="#12302b">ocorreu</text>
<text x="600" y="359" font-size="17" font-weight="bold" fill="#00695c">Exemplo num agente</text>
<text x="600" y="387" font-size="18" fill="#37474f">Log das chamadas de ferramenta, alerta para</text>
<text x="600" y="411" font-size="18" fill="#37474f">chamada fora do escopo, avaliação periódica com</text>
<text x="600" y="435" font-size="18" fill="#37474f">gabarito</text>
<rect x="1080" y="190" width="460" height="280" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="1080" y="190" width="460" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="1098" y="229" font-size="24" font-weight="bold" fill="#12302b">De resposta</text>
<text x="1100" y="290" font-size="19" font-weight="bold" fill="#12302b">Depois da detecção, limita o dano</text>
<text x="1100" y="334" font-size="17" font-weight="bold" fill="#00695c">Exemplo num agente</text>
<text x="1100" y="362" font-size="18" fill="#37474f">Suspensão do agente, revogação do token, reversão</text>
<text x="1100" y="386" font-size="18" fill="#37474f">para a versão anterior da skill</text>
<text x="60" y="510" font-size="18" fill="#37474f">Cada risco pede ao menos um preventivo, um detectivo e a evidência verificável. Sem detectivo, a equipe não sabe se o preventivo falhou, e sem resposta prevista ninguém tem</text>
<text x="60" y="534" font-size="18" fill="#37474f">autoridade para tratar o alerta.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="500" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">NIST AI RMF 1.0: governar atravessa as outras três funções</text>
<rect x="60" y="110" width="1480" height="320" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="90" y="156" font-size="26" font-weight="bold" fill="#12302b">Govern (governar)</text>
<text x="90" y="190" font-size="19" fill="#37474f">Papéis, políticas, tolerância a risco, treinamento, revisão e responsabilização</text>
<rect x="90" y="230" width="440" height="170" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<text x="112" y="276" font-size="24" font-weight="bold" fill="#12302b">Map (mapear)</text>
<text x="112" y="320" font-size="19" fill="#37474f">Finalidade, usuários, dados, partes afetadas,</text>
<text x="112" y="345" font-size="19" fill="#37474f">fornecedores e contexto de uso</text>
<rect x="560" y="230" width="440" height="170" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<text x="582" y="276" font-size="24" font-weight="bold" fill="#12302b">Measure (medir)</text>
<text x="582" y="320" font-size="19" fill="#37474f">Respostas, segurança, privacidade, robustez,</text>
<text x="582" y="345" font-size="19" fill="#37474f">custo, falhas e limitações</text>
<rect x="1030" y="230" width="440" height="170" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<text x="1052" y="276" font-size="24" font-weight="bold" fill="#12302b">Manage (gerenciar)</text>
<text x="1052" y="320" font-size="19" fill="#37474f">Priorizar riscos, mitigar, aprovar ou impedir</text>
<text x="1052" y="345" font-size="19" fill="#37474f">a produção, monitorar e corrigir</text>
<text x="60" y="472" font-size="19" fill="#78909c">As quatro funções não formam uma sequência obrigatória de fases, conforme o guia do facilitador.</text>
</svg>

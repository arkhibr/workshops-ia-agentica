<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="600" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Kit para os primeiros 30 dias, em quatro semanas e sem passo de administrador</text>
<line x1="60" y1="130" x2="1530" y2="130" stroke="#78909c" stroke-width="3" marker-end="url(#sn)"/>
<circle cx="84" cy="130" r="14" fill="#00695c"/>
<text x="84" y="136" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<rect x="60" y="160" width="350" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="60" y="160" width="350" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="199" font-size="23" font-weight="bold" fill="#12302b">Semana 1</text>
<text x="80" y="258" font-size="17" font-weight="bold" fill="#00695c">Atividade</text>
<text x="80" y="286" font-size="18" fill="#37474f">Inventariar pilotos, agentes, skills,</text>
<text x="80" y="310" font-size="18" fill="#37474f">servidores MCP, tokens e provedores</text>
<text x="80" y="354" font-size="17" font-weight="bold" fill="#00695c">Resultado registrado</text>
<text x="80" y="382" font-size="18" font-weight="bold" fill="#12302b">Lista de casos com dono,</text>
<text x="80" y="406" font-size="18" font-weight="bold" fill="#12302b">finalidade e classes de dado</text>
<circle cx="461" cy="130" r="14" fill="#00695c"/>
<text x="461" y="136" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<rect x="437" y="160" width="350" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="437" y="160" width="350" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="455" y="199" font-size="23" font-weight="bold" fill="#12302b">Semana 2</text>
<text x="457" y="258" font-size="17" font-weight="bold" fill="#00695c">Atividade</text>
<text x="457" y="286" font-size="18" fill="#37474f">Adotar a ficha de triagem nas</text>
<text x="457" y="310" font-size="18" fill="#37474f">demandas novas</text>
<text x="457" y="354" font-size="17" font-weight="bold" fill="#00695c">Resultado registrado</text>
<text x="457" y="382" font-size="18" font-weight="bold" fill="#12302b">Faixa com o fator decisivo,</text>
<text x="457" y="406" font-size="18" font-weight="bold" fill="#12302b">premissas e decisões pendentes</text>
<circle cx="837" cy="130" r="14" fill="#00695c"/>
<text x="837" y="136" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<rect x="813" y="160" width="350" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="813" y="160" width="350" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="831" y="199" font-size="23" font-weight="bold" fill="#12302b">Semana 3</text>
<text x="833" y="258" font-size="17" font-weight="bold" fill="#00695c">Atividade</text>
<text x="833" y="286" font-size="18" fill="#37474f">Automatizar os testes T01 a T03 no</text>
<text x="833" y="310" font-size="18" fill="#37474f">pipeline do repositório</text>
<text x="833" y="354" font-size="17" font-weight="bold" fill="#00695c">Resultado registrado</text>
<text x="833" y="382" font-size="18" font-weight="bold" fill="#12302b">Pull requests com as verificações</text>
<text x="833" y="406" font-size="18" font-weight="bold" fill="#12302b">e o escopo dos tokens revisto</text>
<circle cx="1214" cy="130" r="14" fill="#00695c"/>
<text x="1214" y="136" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<rect x="1190" y="160" width="350" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="1190" y="160" width="350" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="1208" y="199" font-size="23" font-weight="bold" fill="#12302b">Semana 4</text>
<text x="1210" y="258" font-size="17" font-weight="bold" fill="#00695c">Atividade</text>
<text x="1210" y="286" font-size="18" fill="#37474f">Revisar um piloto, simular um</text>
<text x="1210" y="310" font-size="18" fill="#37474f">incidente e ajustar o portão</text>
<text x="1210" y="354" font-size="17" font-weight="bold" fill="#00695c">Resultado registrado</text>
<text x="1210" y="382" font-size="18" font-weight="bold" fill="#12302b">Decisão de continuidade, riscos</text>
<text x="1210" y="406" font-size="18" font-weight="bold" fill="#12302b">residuais e plano do mês seguinte</text>
<rect x="60" y="490" width="1480" height="80" rx="14" fill="#ffffff" stroke="#78909c" stroke-width="3" stroke-dasharray="10 7"/>
<text x="84" y="524" font-size="18" fill="#37474f">Fora do kit: configurações gerenciadas e console de administração. Restringir as origens de marketplace vira pedido ao administrador, com a ficha e a evidência da semana 4.</text>
</svg>

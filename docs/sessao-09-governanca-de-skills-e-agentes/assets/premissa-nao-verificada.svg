<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="600" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Premissa não verificada: quando ela torna a faixa preliminar</text>
<text x="60" y="104" font-size="20" fill="#37474f">A ficha separa três estados de cada afirmação</text>
<rect x="60" y="122" width="230" height="44" rx="22" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="175" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#12302b">Fato verificado</text>
<rect x="310" y="122" width="230" height="44" rx="22" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
<text x="425" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#12302b">Hipótese</text>
<rect x="560" y="122" width="230" height="44" rx="22" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
<text x="675" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#12302b">Decisão pendente</text>
<rect x="60" y="210" width="380" height="170" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<text x="84" y="248" font-size="21" font-weight="bold" fill="#12302b">Premissa escrita na ficha</text>
<text x="84" y="282" font-size="18" fill="#37474f">Exemplo: “o token tem só escopo de</text>
<text x="84" y="306" font-size="18" fill="#37474f">leitura”, com o nome de quem vai</text>
<text x="84" y="330" font-size="18" fill="#37474f">verificá-la</text>
<line x1="442" y1="295" x2="516" y2="295" stroke="#78909c" stroke-width="3" marker-end="url(#sn)"/>
<rect x="520" y="210" width="380" height="170" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<text x="544" y="248" font-size="21" font-weight="bold" fill="#12302b">Se for falsa, a faixa muda?</text>
<text x="544" y="282" font-size="18" fill="#37474f">A pergunta separa a premissa que decide</text>
<text x="544" y="306" font-size="18" fill="#37474f">a faixa das demais</text>
<line x1="902" y1="255" x2="976" y2="255" stroke="#e65100" stroke-width="3" marker-end="url(#sl)"/>
<text x="939" y="243" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">sim</text>
<rect x="980" y="190" width="560" height="140" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="1004" y="228" font-size="22" font-weight="bold" fill="#12302b">Faixa preliminar</text>
<text x="1004" y="262" font-size="18" fill="#37474f">A verificação passa a ser condição do gate de publicação, na</text>
<text x="1004" y="286" font-size="18" fill="#37474f">linha “Evidência e gate”</text>
<line x1="902" y1="345" x2="976" y2="400" stroke="#78909c" stroke-width="3" marker-end="url(#sn)"/>
<text x="925" y="395" font-size="18" font-weight="bold" text-anchor="middle" fill="#78909c">não</text>
<rect x="980" y="370" width="560" height="90" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/>
<text x="1004" y="408" font-size="18" fill="#37474f">A premissa continua registrada, com responsável pela</text>
<text x="1004" y="432" font-size="18" fill="#37474f">verificação</text>
<rect x="60" y="470" width="840" height="80" rx="14" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="3"/>
<text x="84" y="504" font-size="18" fill="#37474f">O resultado da verificação atualiza a faixa definida na triagem e libera ou bloqueia o gate de</text>
<text x="84" y="528" font-size="18" fill="#37474f">publicação.</text>
<text x="1540" y="520" font-size="17" text-anchor="end" fill="#78909c">Recomendação desta sessão, sem origem no guia</text>
</svg>

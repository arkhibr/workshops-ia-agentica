<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="620" fill="#ffffff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#12302b">Quatro decisões de autorização e as linhas da ficha que registram cada uma</text>
<rect x="60" y="120" width="340" height="190" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<circle cx="100" cy="162" r="22" fill="#00695c"/>
<text x="100" y="170" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="136" y="160" font-size="21" font-weight="bold" fill="#12302b">Autorizar o caso de uso</text>
<text x="80" y="236" font-size="18" fill="#37474f">Problema legítimo, benefício</text>
<text x="80" y="260" font-size="18" fill="#37474f">esperado e alternativa sem IA</text>
<text x="80" y="284" font-size="18" fill="#37474f">analisada</text>
<rect x="440" y="120" width="340" height="190" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<circle cx="480" cy="162" r="22" fill="#00695c"/>
<text x="480" y="170" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="516" y="160" font-size="21" font-weight="bold" fill="#12302b">Autorizar dados e</text>
<text x="516" y="186" font-size="21" font-weight="bold" fill="#12302b">ferramentas</text>
<text x="460" y="236" font-size="18" fill="#37474f">Dados, modelos, provedores, skills e</text>
<text x="460" y="260" font-size="18" fill="#37474f">integrações permitidos</text>
<rect x="820" y="120" width="340" height="190" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<circle cx="860" cy="162" r="22" fill="#00695c"/>
<text x="860" y="170" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="896" y="160" font-size="21" font-weight="bold" fill="#12302b">Autorizar a autonomia</text>
<text x="840" y="236" font-size="18" fill="#37474f">Sugere, prepara ou executa, com</text>
<text x="840" y="260" font-size="18" fill="#37474f">qual limite e quem interrompe</text>
<rect x="1200" y="120" width="340" height="190" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<circle cx="1240" cy="162" r="22" fill="#00695c"/>
<text x="1240" y="170" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="1276" y="160" font-size="21" font-weight="bold" fill="#12302b">Autorizar produção e</text>
<text x="1276" y="186" font-size="21" font-weight="bold" fill="#12302b">continuidade</text>
<text x="1220" y="236" font-size="18" fill="#37474f">Testes, responsáveis, métricas,</text>
<text x="1220" y="260" font-size="18" fill="#37474f">critérios de parada e revisões</text>
<rect x="60" y="430" width="172" height="76" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="146" y="474" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Dono e finalidade</text>
<path d="M230,310 C230,370 146,370 146,426" fill="none" stroke="#00695c" stroke-width="2.5" marker-end="url(#sv)"/>
<rect x="245" y="430" width="172" height="76" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="331" y="463" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Dados e</text>
<text x="331" y="484" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">ferramentas</text>
<path d="M610,310 C610,370 331,370 331,426" fill="none" stroke="#00695c" stroke-width="2.5" marker-end="url(#sv)"/>
<rect x="429" y="430" width="172" height="76" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="515" y="474" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Autonomia</text>
<path d="M990,310 C990,370 515,370 515,426" fill="none" stroke="#00695c" stroke-width="2.5" marker-end="url(#sv)"/>
<rect x="614" y="430" width="172" height="76" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
<text x="700" y="474" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Faixa de risco</text>
<rect x="798" y="430" width="172" height="76" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
<text x="884" y="463" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Riscos e</text>
<text x="884" y="484" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">controles</text>
<rect x="983" y="430" width="172" height="76" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="1069" y="474" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Evidência e gate</text>
<path d="M1370,310 C1370,370 1069,370 1069,426" fill="none" stroke="#00695c" stroke-width="2.5" marker-end="url(#sv)"/>
<rect x="1168" y="430" width="172" height="76" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="1254" y="474" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Canal e versão</text>
<path d="M1370,310 C1370,370 1254,370 1254,426" fill="none" stroke="#00695c" stroke-width="2.5" marker-end="url(#sv)"/>
<rect x="1352" y="430" width="172" height="76" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="1438" y="463" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">Revisão e</text>
<text x="1438" y="484" font-size="17" font-weight="bold" text-anchor="middle" fill="#12302b">retirada</text>
<path d="M1370,310 C1370,370 1438,370 1438,426" fill="none" stroke="#00695c" stroke-width="2.5" marker-end="url(#sv)"/>
<text x="60" y="535" font-size="18" font-weight="bold" fill="#78909c">Linhas da ficha de governança</text>
<rect x="60" y="568" width="24" height="24" rx="5" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
<text x="96" y="587" font-size="18" fill="#37474f">Linha preenchida pela triagem e pela análise de riscos, sem decisão de autorização própria</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs>
<rect width="1600" height="580" fill="#ffffff"/>
<text x="50" y="60" font-size="30" font-weight="bold" fill="#12302b">Ciclo de vida do plugin percorrido na oficina</text>
<text x="50" y="96" font-size="18" fill="#37474f">Cada etapa indica o experimento e o comando que a executa no marketplace local da ACME</text>

<rect x="50" y="130" width="220" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="50" y="130" width="220" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="68" y="171" font-size="26" font-weight="bold" fill="#12302b">Validar</text>
<text x="68" y="228" font-size="18" font-weight="bold" fill="#00695c">Experimento A</text>
<text x="68" y="260" font-size="17" fill="#37474f">Baixar o zip e</text>
<text x="68" y="285" font-size="17" fill="#37474f">conferir o catálogo</text>
<text x="68" y="310" font-size="17" fill="#37474f">e os dois plugins</text>
<text x="68" y="355" font-size="17" font-family="Menlo, monospace" fill="#12302b">plugin validate</text>

<line x1="272" y1="280" x2="304" y2="280" stroke="#78909c" stroke-width="3" marker-end="url(#seta)"/>

<rect x="306" y="130" width="220" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="306" y="130" width="220" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="324" y="171" font-size="26" font-weight="bold" fill="#12302b">Aprovar</text>
<text x="324" y="228" font-size="18" font-weight="bold" fill="#00695c">Experimento B</text>
<text x="324" y="260" font-size="17" fill="#37474f">O portão lê a ficha</text>
<text x="324" y="285" font-size="17" fill="#37474f">e reprova o controle</text>
<text x="324" y="310" font-size="17" fill="#37474f">feito só de instrução</text>
<text x="324" y="355" font-size="17" font-family="Menlo, monospace" fill="#12302b">node portao.mjs</text>

<line x1="528" y1="280" x2="560" y2="280" stroke="#78909c" stroke-width="3" marker-end="url(#seta)"/>

<rect x="562" y="130" width="220" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="562" y="130" width="220" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="580" y="171" font-size="26" font-weight="bold" fill="#12302b">Instalar</text>
<text x="580" y="228" font-size="18" font-weight="bold" fill="#00695c">Experimento C</text>
<text x="580" y="260" font-size="17" fill="#37474f">Registrar o</text>
<text x="580" y="285" font-size="17" fill="#37474f">marketplace e instalar</text>
<text x="580" y="310" font-size="17" fill="#37474f">como o colega faria</text>
<text x="580" y="355" font-size="17" font-family="Menlo, monospace" fill="#12302b">marketplace add</text>
<text x="580" y="380" font-size="17" font-family="Menlo, monospace" fill="#12302b">plugin install</text>

<line x1="784" y1="280" x2="816" y2="280" stroke="#78909c" stroke-width="3" marker-end="url(#seta)"/>

<rect x="818" y="130" width="220" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="818" y="130" width="220" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="836" y="171" font-size="26" font-weight="bold" fill="#12302b">Versionar</text>
<text x="836" y="228" font-size="18" font-weight="bold" fill="#00695c">Experimento C</text>
<text x="836" y="260" font-size="17" fill="#37474f">Correção publicada</text>
<text x="836" y="285" font-size="17" fill="#37474f">com version 1.0.1</text>
<text x="836" y="310" font-size="17" fill="#37474f">e aviso de atualização</text>
<text x="836" y="355" font-size="17" font-family="Menlo, monospace" fill="#12302b">plugin update</text>

<line x1="1040" y1="280" x2="1072" y2="280" stroke="#78909c" stroke-width="3" marker-end="url(#seta)"/>

<rect x="1074" y="130" width="220" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="1074" y="130" width="220" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="1092" y="171" font-size="26" font-weight="bold" fill="#12302b">Retirar</text>
<text x="1092" y="228" font-size="18" font-weight="bold" fill="#00695c">Experimento D</text>
<text x="1092" y="260" font-size="17" fill="#37474f">Entrada removida e</text>
<text x="1092" y="285" font-size="17" fill="#37474f">nome mapeado para</text>
<text x="1092" y="310" font-size="17" fill="#37474f">null no catálogo</text>
<text x="1092" y="355" font-size="17" font-family="Menlo, monospace" fill="#12302b">"renames"</text>

<line x1="1296" y1="280" x2="1328" y2="280" stroke="#78909c" stroke-width="3" marker-end="url(#seta)"/>

<rect x="1330" y="130" width="220" height="300" rx="14" fill="#ffffff" stroke="#00695c" stroke-width="3"/>
<rect x="1330" y="130" width="220" height="62" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="1348" y="171" font-size="26" font-weight="bold" fill="#12302b">Limpar</text>
<text x="1348" y="228" font-size="18" font-weight="bold" fill="#00695c">Experimento F</text>
<text x="1348" y="260" font-size="17" fill="#37474f">Remover o</text>
<text x="1348" y="285" font-size="17" fill="#37474f">marketplace, o que</text>
<text x="1348" y="310" font-size="17" fill="#37474f">desinstala os plugins</text>
<text x="1348" y="355" font-size="17" font-family="Menlo, monospace" fill="#12302b">marketplace</text>
<text x="1348" y="380" font-size="17" font-family="Menlo, monospace" fill="#12302b">remove</text>

<path d="M672,432 L672,500 L700,500" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#seta)"/>
<rect x="702" y="462" width="640" height="78" rx="14" fill="#ffffff" stroke="#78909c" stroke-width="3" stroke-dasharray="8 6"/>
<text x="722" y="494" font-size="18" font-weight="bold" fill="#37474f">Experimento E: registrar num repositório</text>
<text x="722" y="522" font-size="17" fill="#37474f">--scope project grava caminho absoluto em .claude/settings.json</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="setav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker></defs>
<rect width="1600" height="740" fill="#ffffff"/>
<text x="60" y="64" font-size="30" font-weight="bold" fill="#12302b">Ciclo de vida do token: seis passos de rodízio, do novo token à revogação do antigo</text>
<rect x="60" y="130" width="460" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<circle cx="100" cy="174" r="22" fill="#00695c"/><text x="100" y="182" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="138" y="170" font-size="23" font-weight="bold" fill="#12302b">Criar o novo token</text>
<text x="84" y="226" font-size="19" fill="#37474f">escopo de organização, apenas os escopos</text>
<text x="84" y="251" font-size="19" fill="#37474f">necessários e vida curta</text>
<rect x="570" y="130" width="460" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<circle cx="610" cy="174" r="22" fill="#00695c"/><text x="610" y="182" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="648" y="170" font-size="23" font-weight="bold" fill="#12302b">Guardar o valor no cofre</text>
<text x="594" y="226" font-size="19" fill="#37474f">sem colocá-lo em remoto Git, código,</text>
<text x="594" y="251" font-size="19" fill="#37474f">YAML ou logs</text>
<rect x="1080" y="130" width="460" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<circle cx="1120" cy="174" r="22" fill="#00695c"/><text x="1120" y="182" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="1158" y="170" font-size="23" font-weight="bold" fill="#12302b">Testar o token novo</text>
<text x="1104" y="226" font-size="19" fill="#37474f">numa operação fora de produção</text>
<rect x="60" y="330" width="460" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<circle cx="100" cy="374" r="22" fill="#00695c"/><text x="100" y="382" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="138" y="370" font-size="23" font-weight="bold" fill="#12302b">Atualizar quem usa o token</text>
<text x="138" y="398" font-size="23" font-weight="bold" fill="#12302b">antigo</text>
<text x="84" y="426" font-size="19" fill="#37474f">cada serviço e ferramenta que o utiliza</text>
<rect x="570" y="330" width="460" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<circle cx="610" cy="374" r="22" fill="#00695c"/><text x="610" y="382" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="648" y="370" font-size="23" font-weight="bold" fill="#12302b">Testar cada integração</text>
<text x="594" y="426" font-size="19" fill="#37474f">e verificar falhas de autenticação</text>
<rect x="1080" y="330" width="460" height="150" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<circle cx="1120" cy="374" r="22" fill="#e65100"/><text x="1120" y="382" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="1158" y="370" font-size="23" font-weight="bold" fill="#12302b">Revogar o token antigo</text>
<text x="1104" y="426" font-size="19" fill="#37474f">último passo do rodízio</text>
<line x1="520" y1="205" x2="568" y2="205" stroke="#00695c" stroke-width="3" marker-end="url(#setav)"/>
<line x1="520" y1="405" x2="568" y2="405" stroke="#00695c" stroke-width="3" marker-end="url(#setav)"/>
<line x1="1030" y1="205" x2="1078" y2="205" stroke="#00695c" stroke-width="3" marker-end="url(#setav)"/>
<line x1="1030" y1="405" x2="1078" y2="405" stroke="#00695c" stroke-width="3" marker-end="url(#setav)"/>
<path d="M 1310 280 L 1310 305 L 290 305 L 290 328" fill="none" stroke="#00695c" stroke-width="3" marker-end="url(#setav)"/>
<rect x="60" y="520" width="730" height="150" rx="14" fill="#f5f7f8" stroke="#78909c" stroke-width="3"/>
<text x="80" y="556" font-size="22" font-weight="bold" fill="#12302b">Inventário de cada token</text>
<text x="80" y="587" font-size="19" fill="#37474f">dono, finalidade, escopos, validade e integrações</text>
<rect x="810" y="520" width="730" height="150" rx="14" fill="#f5f7f8" stroke="#78909c" stroke-width="3"/>
<text x="830" y="556" font-size="22" font-weight="bold" fill="#12302b">Revogação imediata quando o token é exposto</text>
<text x="830" y="587" font-size="19" fill="#37474f">o log de auditoria registra criação, expiração, modificação e</text>
<text x="830" y="613" font-size="19" fill="#37474f">revogação, e não o uso, de modo que não indica se o token foi</text>
<text x="830" y="639" font-size="19" fill="#37474f">usado</text>
</svg>
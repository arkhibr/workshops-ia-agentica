<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" font-family="Arial, sans-serif"><rect width="1600" height="480" fill="white"/><text x="60" y="57" font-size="32" font-weight="bold" fill="#12302b">Agente: objetivo, ações e observação</text><text x="60" y="95" font-size="21" fill="#455a64">O agente decide os próximos passos dentro das ferramentas e permissões disponíveis.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker></defs><rect x="60" y="145" width="340" height="220" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="80" y="183" font-size="22" font-weight="bold" fill="#12302b">1. Objetivo</text><text x="80" y="225" font-size="19" fill="#37474f">Identifique os riscos</text><text x="80" y="255" font-size="19" fill="#37474f">desta reunião.</text><line x1="404" y1="255" x2="440" y2="255" stroke="#00695c" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="145" width="340" height="220" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="465" y="183" font-size="22" font-weight="bold" fill="#12302b">2. Escolher e agir</text><text x="465" y="225" font-size="19" fill="#37474f">Decide ler a transcrição</text><text x="465" y="255" font-size="19" fill="#37474f">e chama uma ferramenta.</text><line x1="789" y1="255" x2="825" y2="255" stroke="#00695c" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="145" width="340" height="220" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="850" y="183" font-size="22" font-weight="bold" fill="#12302b">3. Observar e decidir</text><text x="850" y="225" font-size="19" fill="#37474f">Examina o resultado;</text><text x="850" y="255" font-size="19" fill="#37474f">se preciso, executa</text><text x="850" y="285" font-size="19" fill="#37474f">outra ação.</text><line x1="1174" y1="255" x2="1210" y2="255" stroke="#00695c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1215" y="145" width="340" height="220" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="2"/><text x="1235" y="183" font-size="22" font-weight="bold" fill="#12302b">4. Entregar</text><text x="1235" y="225" font-size="19" fill="#37474f">Apresenta os riscos</text><text x="1235" y="255" font-size="19" fill="#37474f">e suas evidências.</text><text x="60" y="425" font-size="20" fill="#455a64">O agente pode repetir o ciclo de ação e observação antes de responder.</text></svg>
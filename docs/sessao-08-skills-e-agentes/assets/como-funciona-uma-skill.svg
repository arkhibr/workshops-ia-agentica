<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" font-family="Arial, sans-serif"><rect width="1600" height="480" fill="white"/><text x="60" y="57" font-size="32" font-weight="bold" fill="#12302b">Skill: uma capacidade reutilizável</text><text x="60" y="95" font-size="21" fill="#455a64">A mesma orientação é aplicada a entradas diferentes.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker></defs><rect x="60" y="145" width="340" height="220" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="80" y="183" font-size="22" font-weight="bold" fill="#12302b">1. Pedido e entrada</text><text x="80" y="225" font-size="19" fill="#37474f">Analise esta transcrição</text><text x="80" y="255" font-size="19" fill="#37474f">de reunião.</text><line x1="404" y1="255" x2="440" y2="255" stroke="#00695c" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="145" width="340" height="220" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="465" y="183" font-size="22" font-weight="bold" fill="#12302b">2. Skill acionada</text><text x="465" y="225" font-size="19" fill="#37474f">Instruções e critérios</text><text x="465" y="255" font-size="19" fill="#37474f">para tarefas e riscos</text><line x1="789" y1="255" x2="825" y2="255" stroke="#00695c" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="145" width="340" height="220" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="850" y="183" font-size="22" font-weight="bold" fill="#12302b">3. Trabalho do agente</text><text x="850" y="225" font-size="19" fill="#37474f">Lê a transcrição; consulta</text><text x="850" y="255" font-size="19" fill="#37474f">modelo e script, se preciso</text><line x1="1174" y1="255" x2="1210" y2="255" stroke="#00695c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1215" y="145" width="340" height="220" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="2"/><text x="1235" y="183" font-size="22" font-weight="bold" fill="#12302b">4. Resultado</text><text x="1235" y="225" font-size="19" fill="#37474f">Relatório com evidências</text><text x="1235" y="255" font-size="19" fill="#37474f">e itens a confirmar</text><text x="60" y="425" font-size="20" fill="#455a64">O script confere a estrutura; uma pessoa compara o conteúdo com a transcrição.</text></svg>
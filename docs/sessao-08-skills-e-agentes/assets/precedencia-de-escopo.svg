<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="60" y="64" font-size="32" font-weight="bold" fill="#12302b">Quando dois arquivos têm o mesmo nome, qual vale: a ordem de escopo</text>

  <text x="60" y="118" font-size="26" font-weight="bold" fill="#00695c">Subagentes</text>
  <text x="860" y="118" font-size="26" font-weight="bold" fill="#00695c">Skills</text>
  <text x="300" y="118" font-size="19" fill="#546e7a">do que vale primeiro para o que vale por último</text>
  <text x="1010" y="118" font-size="19" fill="#546e7a">do que vale primeiro para o que vale por último</text>

  <!-- subagentes -->
  <g>
    <rect x="60" y="140" width="740" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="112" cy="186" r="26" fill="#00695c"/><text x="112" y="196" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="160" y="178" font-size="25" font-weight="bold" fill="#12302b">Configurações gerenciadas</text>
    <text x="160" y="210" font-size="19" fill="#37474f">implantadas pela organização, valem para todos</text>

    <rect x="60" y="246" width="740" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="112" cy="292" r="26" fill="#00695c"/><text x="112" y="302" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="160" y="284" font-size="25" font-weight="bold" fill="#12302b"><tspan font-family="Menlo, monospace" font-size="23">--agents</tspan> na linha de comando</text>
    <text x="160" y="316" font-size="19" fill="#37474f">JSON passado ao iniciar, existe só naquela sessão</text>

    <rect x="60" y="352" width="740" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="112" cy="398" r="26" fill="#00695c"/><text x="112" y="408" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="160" y="390" font-size="25" font-weight="bold" fill="#12302b"><tspan font-family="Menlo, monospace" font-size="23">.claude/agents/</tspan> do projeto</text>
    <text x="160" y="422" font-size="19" fill="#37474f">versionado com o código, vale para quem trabalha no repositório</text>

    <rect x="60" y="458" width="740" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="112" cy="504" r="26" fill="#00695c"/><text x="112" y="514" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="160" y="496" font-size="25" font-weight="bold" fill="#12302b"><tspan font-family="Menlo, monospace" font-size="23">~/.claude/agents/</tspan> pessoal</text>
    <text x="160" y="528" font-size="19" fill="#37474f">vale para todos os projetos da pessoa</text>

    <rect x="60" y="564" width="740" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="112" cy="610" r="26" fill="#00695c"/><text x="112" y="620" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="160" y="602" font-size="25" font-weight="bold" fill="#12302b">Pasta <tspan font-family="Menlo, monospace" font-size="23">agents/</tspan> de um plugin</text>
    <text x="160" y="634" font-size="19" fill="#37474f">vale onde o plugin está habilitado, e é o de menor prioridade</text>
    <text x="60" y="690" font-size="18" fill="#546e7a">Em pastas aninhadas do projeto, vale a definição mais próxima do diretório de trabalho.</text>
    <text x="60" y="716" font-size="18" fill="#546e7a">Dois arquivos com o mesmo name na mesma árvore: carrega só um, sem precedência documentada.</text>
  </g>

  <!-- skills -->
  <g>
    <rect x="860" y="140" width="680" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="912" cy="186" r="26" fill="#00695c"/><text x="912" y="196" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="960" y="178" font-size="25" font-weight="bold" fill="#12302b">Corporativa (enterprise)</text>
    <text x="960" y="210" font-size="19" fill="#37474f">na pasta de configurações gerenciadas</text>

    <rect x="860" y="246" width="680" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="912" cy="292" r="26" fill="#00695c"/><text x="912" y="302" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="960" y="284" font-size="25" font-weight="bold" fill="#12302b"><tspan font-family="Menlo, monospace" font-size="23">~/.claude/skills/</tspan> pessoal</text>
    <text x="960" y="316" font-size="19" fill="#37474f">vale para todos os projetos da pessoa</text>

    <rect x="860" y="352" width="680" height="92" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
    <circle cx="912" cy="398" r="26" fill="#00695c"/><text x="912" y="408" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="960" y="390" font-size="25" font-weight="bold" fill="#12302b"><tspan font-family="Menlo, monospace" font-size="23">.claude/skills/</tspan> do projeto</text>
    <text x="960" y="422" font-size="19" fill="#37474f">versionado com o código, o de menor prioridade entre os três</text>

    <rect x="860" y="458" width="680" height="92" rx="14" fill="#ffffff" stroke="#78909c" stroke-width="3" stroke-dasharray="12 7"/>
    <text x="890" y="496" font-size="25" font-weight="bold" fill="#12302b">Plugin</text>
    <text x="890" y="528" font-size="19" fill="#37474f">não compete: o nome ganha o prefixo <tspan font-family="Menlo, monospace" font-size="18">/plugin:skill</tspan></text>
    <text x="860" y="590" font-size="18" fill="#546e7a">Skill na raiz do projeto e skill aninhada com o mesmo nome carregam as duas.</text>
  </g>

  <!-- chamada -->
  <rect x="60" y="750" width="1480" height="80" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
  <text x="90" y="798" font-size="23" font-weight="bold" fill="#12302b">A ordem se inverte: em subagentes o projeto vence o escopo pessoal, e em skills o escopo pessoal vence o projeto.</text>
</svg>

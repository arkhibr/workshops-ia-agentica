<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
<marker id="setav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker></defs>
<rect width="1600" height="780" fill="#ffffff"/>
<text x="60" y="64" font-size="30" font-weight="bold" fill="#12302b">Identidade do agente: própria e restrita, nunca a conta pessoal integrada</text>
<rect x="60" y="120" width="500" height="260" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
<text x="80" y="156" font-size="23" font-weight="bold" fill="#12302b">Evitar: identidade pessoal</text>
<text x="80" y="184" font-size="23" font-weight="bold" fill="#12302b">integrada</text>
<text x="80" y="216" font-size="19" fill="#37474f">a identidade integrada do Windows ou a</text>
<text x="80" y="242" font-size="19" fill="#37474f">senha de domínio da pessoa daria ao</text>
<text x="80" y="268" font-size="19" fill="#37474f">agente tudo o que a pessoa pode fazer,</text>
<text x="80" y="294" font-size="19" fill="#37474f">sem limite de escopo</text>
<line x1="570" y1="250" x2="640" y2="250" stroke="#e65100" stroke-width="3" marker-end="url(#seta)"/>
<rect x="650" y="120" width="890" height="260" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="676" y="158" font-size="23" font-weight="bold" fill="#12302b">Preferir: identidade própria do agente, por ordem de preferência</text>
<circle cx="690" cy="206" r="18" fill="#00695c"/><text x="690" y="213" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="722" y="202" font-size="19" fill="#37474f">Identidade de aplicação, quando a ferramenta aceita: token do Microsoft Entra,</text>
<text x="722" y="226" font-size="19" fill="#37474f">identidade gerenciada ou service principal</text>
<circle cx="690" cy="268" r="18" fill="#00695c"/><text x="690" y="275" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="722" y="264" font-size="19" fill="#37474f">Senão, PAT de escopo de organização, com os escopos mínimos e a vida mais curta</text>
<text x="722" y="288" font-size="19" fill="#37474f">possível</text>
<circle cx="690" cy="330" r="18" fill="#00695c"/><text x="690" y="337" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="722" y="326" font-size="19" fill="#37474f">No GitHub, token de granularidade fina, restrito aos repositórios e às permissões</text>
<text x="722" y="350" font-size="19" fill="#37474f">necessárias</text>
<text x="60" y="440" font-size="22" font-weight="bold" fill="#12302b">Regras que valem para qualquer token do agente</text>
<rect x="60" y="470" width="480" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="80" y="506" font-size="22" font-weight="bold" fill="#12302b">Um token para cada ferramenta</text>
<text x="80" y="533" font-size="22" font-weight="bold" fill="#12302b">ou fluxo</text>
<text x="80" y="564" font-size="19" fill="#37474f">sem compartilhar o valor entre eles</text>
<rect x="560" y="470" width="480" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="580" y="506" font-size="22" font-weight="bold" fill="#12302b">Expiração sempre definida</text>
<text x="580" y="537" font-size="19" fill="#37474f">no GitHub, o padrão do token de</text>
<text x="580" y="563" font-size="19" fill="#37474f">granularidade fina é de 30 dias</text>
<rect x="1060" y="470" width="480" height="150" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="1080" y="506" font-size="22" font-weight="bold" fill="#12302b">Valor no cofre de segredos</text>
<text x="1080" y="537" font-size="19" fill="#37474f">ou no gerenciador de credenciais, nunca no</text>
<text x="1080" y="563" font-size="19" fill="#37474f">repositório</text>
<text x="60" y="672" font-size="20" fill="#37474f">Um PAT identifica a pessoa que o criou e não concede mais permissões do que ela possui, o que delimita o dano máximo e não o elimina.</text>
<text x="60" y="706" font-size="19" fill="#546e7a">Os PATs globais do Azure DevOps deixam de funcionar em 1º de dezembro de 2026, segundo a Microsoft.</text>
</svg>
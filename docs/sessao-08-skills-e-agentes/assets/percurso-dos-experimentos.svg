<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00695c"/></marker></defs>
<rect width="1600" height="760" fill="#ffffff"/>
<text x="60" y="64" font-size="27" font-weight="bold" fill="#12302b">Percurso da oficina: dois experimentos em aula e quatro de extensão, cada um ligado a uma linha da ficha</text>

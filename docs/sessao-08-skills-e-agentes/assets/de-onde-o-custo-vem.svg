<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="780" fill="#ffffff"/>
<text x="60" y="64" font-size="30" font-weight="bold" fill="#12302b">De onde o custo vem: cada pedido carrega a conversa inteira, e outros fatores multiplicam os pedidos</text>
<text x="60" y="112" font-size="20" fill="#546e7a">Ilustração sem escala: o contexto acumulado é reenviado a cada pedido, e cada uso de ferramenta gera outro pedido</text>
<text x="60" y="177" font-size="21" font-weight="bold" fill="#12302b">Pedido 1</text>
<rect x="190" y="150" width="190" height="40" rx="6" fill="#b0bec5"/>
<text x="285.0" y="176" font-size="17" font-weight="bold" fill="#263238" text-anchor="middle">contexto acumulado</text>
<text x="60" y="239" font-size="21" font-weight="bold" fill="#12302b">Pedido 2</text>
<rect x="190" y="212" width="190" height="40" rx="6" fill="#b0bec5"/>
<text x="285.0" y="238" font-size="17" font-weight="bold" fill="#263238" text-anchor="middle">contexto acumulado</text>
<rect x="380" y="212" width="140" height="40" rx="6" fill="#e65100"/>
<text x="450.0" y="238" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">resultado</text>
<text x="60" y="301" font-size="21" font-weight="bold" fill="#12302b">Pedido 3</text>
<rect x="190" y="274" width="330" height="40" rx="6" fill="#b0bec5"/>
<text x="355.0" y="300" font-size="17" font-weight="bold" fill="#263238" text-anchor="middle">contexto acumulado</text>
<rect x="520" y="274" width="140" height="40" rx="6" fill="#e65100"/>
<text x="590.0" y="300" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">resultado</text>
<text x="60" y="363" font-size="21" font-weight="bold" fill="#12302b">Pedido 4</text>
<rect x="190" y="336" width="470" height="40" rx="6" fill="#b0bec5"/>
<text x="425.0" y="362" font-size="17" font-weight="bold" fill="#263238" text-anchor="middle">contexto acumulado</text>
<rect x="660" y="336" width="140" height="40" rx="6" fill="#e65100"/>
<text x="730.0" y="362" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">resultado</text>
<text x="60" y="425" font-size="21" font-weight="bold" fill="#12302b">Pedido 5</text>
<rect x="190" y="398" width="610" height="40" rx="6" fill="#b0bec5"/>
<text x="495.0" y="424" font-size="17" font-weight="bold" fill="#263238" text-anchor="middle">contexto acumulado</text>
<rect x="800" y="398" width="140" height="40" rx="6" fill="#e65100"/>
<text x="870.0" y="424" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">resultado</text>
<text x="190" y="478" font-size="18" fill="#546e7a">cinza: o contexto que o pedido reenvia. laranja: o resultado da ferramenta que o pedido seguinte também carrega</text>
<rect x="1130" y="150" width="410" height="296" rx="14" fill="#f5f7f8" stroke="#78909c" stroke-width="3"/>
<text x="1152" y="188" font-size="22" font-weight="bold" fill="#12302b">Médias do guia de custo</text>
<text x="1152" y="226" font-size="19" fill="#37474f">cerca de US$ 13 por desenvolvedor</text>
<text x="1152" y="254" font-size="19" fill="#37474f">por dia ativo, em implantações</text>
<text x="1152" y="282" font-size="19" fill="#37474f">corporativas, e de US$ 150 a</text>
<text x="1152" y="310" font-size="19" fill="#37474f">US$ 250 por mês</text>
<text x="1152" y="338" font-size="19" fill="#37474f">abaixo de US$ 30 por dia ativo</text>
<text x="1152" y="366" font-size="19" fill="#37474f">para 90% dos usuários</text>
<text x="1152" y="406" font-size="17" fill="#546e7a">médias de uso geral, variam com o modelo,</text><text x="1152" y="430" font-size="17" fill="#546e7a">o código e o uso de várias instâncias</text>
<text x="60" y="530" font-size="22" font-weight="bold" fill="#12302b">Outros fatores que o guia lista</text>
<rect x="60" y="556" width="470" height="70" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="586" font-size="19" font-weight="bold" fill="#12302b">Falha de cache após pausa maior</text><text x="78" y="611" font-size="19" font-weight="bold" fill="#12302b">que a vida do cache</text>
<rect x="565" y="556" width="470" height="70" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="583" y="586" font-size="19" font-weight="bold" fill="#12302b">Tarefas agendadas que reenviam o</text><text x="583" y="611" font-size="19" font-weight="bold" fill="#12302b">contexto a cada disparo</text>
<rect x="1070" y="556" width="470" height="70" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="1088" y="586" font-size="19" font-weight="bold" fill="#12302b">Cada subagente e cada integrante</text><text x="1088" y="611" font-size="19" font-weight="bold" fill="#12302b">de equipe de agentes</text>
<rect x="60" y="646" width="470" height="70" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="78" y="676" font-size="19" font-weight="bold" fill="#12302b">Compactação, que é em</text><text x="78" y="701" font-size="19" font-weight="bold" fill="#12302b">si um pedido grande</text>
<rect x="565" y="646" width="470" height="70" rx="14" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="583" y="676" font-size="19" font-weight="bold" fill="#12302b">Raciocínio estendido, cobrado como</text><text x="583" y="701" font-size="19" font-weight="bold" fill="#12302b">tokens de saída</text>
</svg>
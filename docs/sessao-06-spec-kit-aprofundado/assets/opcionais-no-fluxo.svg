<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00695c"/>
    </marker>
    <marker id="seta-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78909c"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="60" y="64" font-size="32" font-weight="bold" fill="#12302b">Comandos opcionais do Spec Kit 1.1.1: onde cada um entra no fluxo</text>

  <!-- clarify, acima, entre specify e plan -->
  <rect x="408" y="104" width="260" height="150" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="538" y="146" font-size="25" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">clarify</text>
  <text x="538" y="180" font-size="17" fill="#4e342e" text-anchor="middle">até 5 perguntas ao PO,</text>
  <text x="538" y="203" font-size="17" fill="#4e342e" text-anchor="middle">uma por vez</text>
  <text x="538" y="232" font-size="15" fill="#37474f" text-anchor="middle" font-family="Menlo, monospace">altera spec.md</text>
  <line x1="538" y1="254" x2="538" y2="392" stroke="#e65100" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#seta-laranja)"/>

  <!-- analyze, acima, entre tasks e implement -->
  <rect x="912" y="104" width="260" height="150" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="1042" y="146" font-size="25" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">analyze</text>
  <text x="1042" y="180" font-size="17" fill="#4e342e" text-anchor="middle">confere spec, plan e tasks</text>
  <text x="1042" y="203" font-size="17" fill="#4e342e" text-anchor="middle">contra a constitution</text>
  <text x="1042" y="232" font-size="15" fill="#37474f" text-anchor="middle">não altera nenhum arquivo</text>
  <line x1="1042" y1="254" x2="1042" y2="392" stroke="#e65100" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#seta-laranja)"/>

  <!-- caminho básico -->
  <rect x="60" y="330" width="200" height="130" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/>
  <text x="160" y="385" font-size="22" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">constitution</text>
  <text x="160" y="420" font-size="16" fill="#2f4f4a" text-anchor="middle">princípios</text>
  <line x1="260" y1="395" x2="308" y2="395" stroke="#00695c" stroke-width="4" marker-end="url(#seta)"/>

  <rect x="312" y="330" width="200" height="130" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/>
  <text x="412" y="385" font-size="22" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">specify</text>
  <text x="412" y="420" font-size="16" fill="#2f4f4a" text-anchor="middle">spec.md</text>
  <line x1="512" y1="395" x2="560" y2="395" stroke="#00695c" stroke-width="4" marker-end="url(#seta)"/>

  <rect x="564" y="330" width="200" height="130" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="664" y="385" font-size="22" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">plan</text>
  <text x="664" y="420" font-size="16" fill="#2f4f4a" text-anchor="middle">plan.md e apoio</text>
  <line x1="764" y1="395" x2="812" y2="395" stroke="#00695c" stroke-width="4" marker-end="url(#seta)"/>

  <rect x="816" y="330" width="200" height="130" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="916" y="385" font-size="22" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">tasks</text>
  <text x="916" y="420" font-size="16" fill="#2f4f4a" text-anchor="middle">tasks.md</text>
  <line x1="1016" y1="395" x2="1064" y2="395" stroke="#00695c" stroke-width="4" marker-end="url(#seta)"/>

  <rect x="1068" y="330" width="200" height="130" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="1168" y="385" font-size="22" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">implement</text>
  <text x="1168" y="420" font-size="16" fill="#2f4f4a" text-anchor="middle">código e testes</text>
  <line x1="1268" y1="395" x2="1316" y2="395" stroke="#78909c" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#seta-cinza)"/>

  <rect x="1320" y="330" width="220" height="130" rx="14" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/>
  <text x="1430" y="380" font-size="22" font-weight="bold" fill="#607d8b" text-anchor="middle" font-family="Menlo, monospace">converge</text>
  <text x="1430" y="412" font-size="15" fill="#607d8b" text-anchor="middle">tarefas restantes</text>
  <text x="1430" y="436" font-size="15" fill="#607d8b" text-anchor="middle">fora do workshop</text>

  <!-- checklist, abaixo, depois do plan -->
  <rect x="660" y="560" width="260" height="150" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="3" stroke-dasharray="12 7"/>
  <text x="790" y="602" font-size="25" font-weight="bold" fill="#12302b" text-anchor="middle" font-family="Menlo, monospace">checklist</text>
  <text x="790" y="636" font-size="17" fill="#4e342e" text-anchor="middle">testa a escrita dos</text>
  <text x="790" y="659" font-size="17" fill="#4e342e" text-anchor="middle">requisitos, itens CHK</text>
  <text x="790" y="688" font-size="15" fill="#37474f" text-anchor="middle" font-family="Menlo, monospace">cria checklists/</text>
  <line x1="790" y1="560" x2="790" y2="402" stroke="#e65100" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#seta-laranja)"/>

  <!-- trava do implement -->
  <path d="M920,640 L1168,640 L1168,464" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#seta-laranja)"/>
  <text x="1190" y="600" font-size="18" font-weight="bold" fill="#c62828">trava: item não marcado</text>
  <text x="1190" y="626" font-size="17" fill="#c62828">o implement para e pergunta</text>

  <!-- legenda -->
  <rect x="60" y="742" width="1480" height="54" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="800" y="776" font-size="19" fill="#4e342e" text-anchor="middle">O clarify altera a spec, o checklist cria um arquivo próprio e o analyze não altera nenhum arquivo do projeto.</text>
</svg>

site_name: IA Agêntica na Prática
site_description: Workshop de engenharia agêntica disciplinada para a equipe de desenvolvimento C#, JavaScript e TypeScript da FUNDEP
site_url: https://arkhibr.github.io/workshops-ia-agentica/
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Bloco 1 — Fundamentos:
      - S1 — O que mudou:
          - Visão geral: sessao-01-o-que-mudou/index.md

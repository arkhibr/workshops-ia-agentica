site_name: IA Agêntica na Prática
site_description: Workshop de engenharia agêntica disciplinada para a equipe de desenvolvimento C#, JavaScript e TypeScript da FUNDEP
site_url: https://arkhibr.github.io/workshops-ia-agentica/
use_directory_urls: true

theme:
  name: material
  language: pt-BR
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Bloco 1 — Fundamentos:
      - S1 — O que mudou:
          - Visão geral: sessao-01-o-que-mudou/index.md
          - Modos de trabalho com IA: sessao-01-o-que-mudou/modos-de-trabalho.md
          - Evidência empírica de produtividade: sessao-01-o-que-mudou/evidencia-empirica.md
          - A tese do Software 3.0: sessao-01-o-que-mudou/software-3-0.md
          - Sistemas agênticos e simplicidade: sessao-01-o-que-mudou/sistemas-agenticos.md
          - Avaliação de modelos: sessao-01-o-que-mudou/avaliacao-de-modelos.md
          - Exemplo arquitetural: sessao-01-o-que-mudou/exemplo-arquitetural.md
          - Estudo de caso: sessao-01-o-que-mudou/estudo-de-caso.md
          - Oficina de ferramentas: sessao-01-o-que-mudou/oficina-de-ferramentas.md
          - Exercícios: sessao-01-o-que-mudou/exercicios.md
          - Síntese e referências: sessao-01-o-que-mudou/sintese-e-referencias.md
      - S2 — O ambiente agêntico:
          - Visão geral: sessao-02-ambiente-agentico/index.md
          - O ambiente compartilhado: sessao-02-ambiente-agentico/ambiente-compartilhado.md
          - O arnês do agente: sessao-02-ambiente-agentico/arnes.md
          - Engenharia de contexto: sessao-02-ambiente-agentico/engenharia-de-contexto.md
          - MCP e ferramentas externas: sessao-02-ambiente-agentico/mcp.md
          - O arquivo de instrução: sessao-02-ambiente-agentico/arquivo-de-instrucao.md
          - Isolamento por ramo: sessao-02-ambiente-agentico/isolamento-por-ramo.md
          - Autonomia e supervisão: sessao-02-ambiente-agentico/autonomia-e-supervisao.md
          - Exemplo arquitetural: sessao-02-ambiente-agentico/exemplo-arquitetural.md
          - Estudo de caso: sessao-02-ambiente-agentico/estudo-de-caso.md
          - Oficina de ferramentas: sessao-02-ambiente-agentico/oficina-de-ferramentas.md
          - Exercícios: sessao-02-ambiente-agentico/exercicios.md
          - Síntese e referências: sessao-02-ambiente-agentico/sintese-e-referencias.md
  - Bloco 2 — Especificação e Planejamento:
      - S3 — Exploração e especificação: sessao-03-exploracao-especificacao/index.md
      - S4 — Regras formais com IA: sessao-04-regras-formais-com-ia/index.md
      - S5 — Decomposição: sessao-05-decomposicao/index.md
  - Bloco 3 — Execução:
      - S6 — TDD assistido por IA: sessao-06-tdd-assistido/index.md
      - S7 — Estratégias avançadas de teste: sessao-07-estrategias-avancadas-teste/index.md
      - S8 — SDD ciclo completo: sessao-08-sdd-ciclo-completo/index.md
  - Bloco 4 — Qualidade e Integração:
      - S9 — Depuração sistemática: sessao-09-depuracao-sistematica/index.md
      - S10 — Esteira completa: sessao-10-esteira-completa/index.md
  - Referência:
      - Bibliografia: referencia/bibliografia.md

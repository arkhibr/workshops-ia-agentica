site_name: IA Agêntica na Prática
site_description: Workshop de engenharia agêntica disciplinada para equipes de desenvolvimento C#, JavaScript e TypeScript
site_url: https://arkhibr.github.io/workshops-ia-agentica/
use_directory_urls: true

# Plano e especificação internos ficam no repositório, fora do site publicado.
exclude_docs: |
  superpowers/

theme:
  name: material
  language: pt-BR
  palette:
    scheme: default
    primary: green
    accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

